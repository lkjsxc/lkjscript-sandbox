name: Verify sandbox
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/check-repository.mjs
  traffic-city:
    runs-on: ubuntu-24.04
    # Native build plus all existing suites and the added directed-trip traces.
    # This outer CI budget does not change game/runtime or test admission limits.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/traffic-city/package-lock.json
      - run: ./sandbox traffic-city setup
      - run: npx playwright install --with-deps chromium webkit
        working-directory: projects/traffic-city
      - run: ./sandbox traffic-city build
      - run: ./sandbox traffic-city test
      - run: npm run test:junction-flow
        working-directory: projects/traffic-city
      - run: npm run test:continuous-management
        working-directory: projects/traffic-city
      - run: npm run test:city-flow-ui
        working-directory: projects/traffic-city
      - run: npm run test:ui-management
        working-directory: projects/traffic-city
      - run: npm run test:commuter
        working-directory: projects/traffic-city
      - run: npm run test:commuter-ui
        working-directory: projects/traffic-city
      - run: npm run test:tunnels
        working-directory: projects/traffic-city
      - run: npm run test:tunnel-ui
        working-directory: projects/traffic-city
      - run: npm run test:city-lab-ui
        working-directory: projects/traffic-city
      - run: npm run test:rail
        working-directory: projects/traffic-city
      - run: npm run test:repair
        working-directory: projects/traffic-city
      - run: ./sandbox traffic-city smoke
      - run: npm run test:motion-cadence
        working-directory: projects/traffic-city
      - run: npm run test:webkit
        working-directory: projects/traffic-city
      - run: npm run test:delay-atlas
        working-directory: projects/traffic-city
      - run: npm run test:delay-atlas-ui
        working-directory: projects/traffic-city
      - run: npm run test:waterfront
        working-directory: projects/traffic-city
      - run: npm run test:money-events
        working-directory: projects/traffic-city
      - run: npm run test:region
        working-directory: projects/traffic-city
      - run: npm run test:region-live
        working-directory: projects/traffic-city
      - run: npm run test:region-ui
        working-directory: projects/traffic-city
      - run: npm run test:save-capacity
        working-directory: projects/traffic-city
      - run: npm run test:waterfront-ui
        working-directory: projects/traffic-city
      - run: npm run test:planning-bounds
        working-directory: projects/traffic-city
      - run: npm run test:planning-ui
        working-directory: projects/traffic-city
      - run: npm run test:street-presentation
        working-directory: projects/traffic-city
      - run: npm run test:walkability
        working-directory: projects/traffic-city
      - run: npm run test:street-ui
        working-directory: projects/traffic-city
